#:schema https://learn.chatgpt.com/docs/config-schema.json
# Public Codex configuration example.
# Verified against codex-cli 0.144.1 on 2026-07-10.
# Merge into ~/.codex/config.toml manually. Do not overwrite an existing config blindly.

# Choose a model that is available to your Codex account.
# model = "gpt-5.6-sol"
model_provider = "openai"

approval_policy = "on-request"
sandbox_mode = "workspace-write"
developer_instructions = "Respond clearly, precisely, and with evidence when facts are uncertain."

project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536
tool_output_token_limit = 40000

hide_agent_reasoning = true
model_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "high"
personality = "pragmatic"
# Standard speed is the default. Configure service_tier only when you intentionally use Fast/Flex.

web_search = "cached"

check_for_update_on_startup = true

[shell_environment_policy]
inherit = "all"

[sandbox_workspace_write]
# Leave shell-command network access disabled by default. The built-in web_search tool is separate.
network_access = false

[features]
memories = true
unified_exec = true
child_agents_md = true

[agents]
max_threads = 5
max_depth = 1

[agents.default]
description = "General-purpose helper."

[agents.worker]
description = "Drafts or edits scoped document content and configuration files."

[agents.explorer]
description = "Read-only exploration: searches, reads, maps documents, sources, and references."

[agents.awaiter]
description = "Monitors long-running document conversion, validation, export, or research commands."

[agents.reviewer]
description = "Reviews documents, designs, standards, or evidence against quality gates."

[analytics]
enabled = false

# --- MCP Servers ---
# Public default: all external MCP servers are disabled until credentials and data-flow implications are reviewed.
# Version policy: pin only Context7 to the tested version; leave other npm MCP packages unpinned.

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.3.0"]
enabled = false
tool_timeout_sec = 60
env_vars = ["CONTEXT7_API_KEY"]

[mcp_servers.tavily]
command = "npx"
args = ["-y", "tavily-mcp"]
enabled = false
tool_timeout_sec = 30
env_vars = ["TAVILY_API_KEY"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
enabled = false

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"
enabled = false
enabled_tools = ["read_wiki_structure", "read_wiki_contents", "ask_question"]

[mcp_servers.brave-search]
command = "npx"
args = ["-y", "@brave/brave-search-mcp-server", "--transport", "stdio"]
enabled = false
tool_timeout_sec = 30
env_vars = ["BRAVE_API_KEY"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]
enabled = false
tool_timeout_sec = 120

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp"]
enabled = false

# Augment Context Engine is intentionally omitted from the default runnable example
# because relay URLs and token handling are deployment-specific.
# If you enable it, use environment variables and do not commit private relay URLs.
